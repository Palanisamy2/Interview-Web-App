version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: assessment_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: skill_assessment
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: assessment_backend
    restart: unless-stopped
    environment:
      PORT: 5000
      NODE_ENV: production
      DB_DIALECT: postgres
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: skill_assessment
      DB_USER: postgres
      DB_PASSWORD: postgrespassword
      JWT_SECRET: skill_assessment_platform_secret_jwt_key_2026
    ports:
      - '5000:5000'
    depends_on:
      - postgres

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: assessment_frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:5000
    ports:
      - '3000:3000'
    depends_on:
      - backend

volumes:
  pgdata:

